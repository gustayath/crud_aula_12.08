<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início | Minha Página</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 8%;
    }
    nav h2 { color: #38bdf8; }
    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 24px;
    }
    nav a:hover { color: #38bdf8; }
    main {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 8%;
    }
    .hero { max-width: 700px; }
    .hero h1 {
      font-size: 3.5rem;
      margin-bottom: 20px;
    }
    .hero h1 span { color: #38bdf8; }
    .hero p {
      color: #cbd5e1;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    .btn:hover { background: #7dd3fc; }
    footer {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }
    @media (max-width: 600px) {
      .hero h1 { font-size: 2.4rem; }
      nav a { margin-left: 10px; }
    }
  </style>
</head>
<body>

  

  <main>
    <section class="hero">
      <h1>Bem-vindo à <span>Minha Página</span></h1>
      <a href="{% url 'cadastro' %}" class="btn">Cadastrar-se</a>
      <a href="{% url 'login' %}" class="btn">Fazer Login</a>
    </section>
  </main>

</body>
</html>
