<!-- Segunda etapa: confirma que o usuário também possui acesso ao e-mail. -->
<h2>Validação 2FA - Etapa 2</h2>
<p>Um código de 6 dígitos foi enviado para o seu e-mail. Digite-o abaixo:</p>

<!-- Exibe mensagens de código inválido ou expirado. -->
{% if messages %}
  {% for message in messages %}
    <p style="color: red;">{{ message }}</p>
  {% endfor %}
{% endif %}

<!-- O código é enviado à view MFA para validação e uso único. -->
<form method="post">
  {% csrf_token %}
  <label for="code">Código de 6 dígitos:</label>
  <input type="text" name="code" maxlength="6" required placeholder="000000">
  <br>
  <button type="submit">Validar e Entrar</button>
</form>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        min-height: 100%;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 30px 15px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        position: relative;
        overflow: hidden;

        font-family: "Trebuchet MS", Arial, sans-serif;
        color: #17556d;

        background:
            linear-gradient(
                to bottom,
                #35c9f2 0%,
                #8de9fa 38%,
                #e1fbff 64%,
                #8bdf73 65%,
                #43b94c 100%
            );
    }

    /* Brilho solar */
    body::before {
        content: "";
        position: fixed;

        width: 650px;
        height: 650px;

        top: -350px;
        left: 50%;

        transform: translateX(-50%);

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(255,255,255,.75) 0%,
                rgba(255,255,255,.28) 35%,
                transparent 70%
            );

        pointer-events: none;

        animation: sunPulse 6s ease-in-out infinite alternate;
    }

    /* Bolhas brilhantes no céu */
    body::after {
        content: "";

        position: fixed;
        inset: 0;

        pointer-events: none;

        background:
            radial-gradient(circle at 8% 22%,
                rgba(255,255,255,.9) 0 4px,
                transparent 5px),

            radial-gradient(circle at 16% 73%,
                rgba(255,255,255,.55) 0 3px,
                transparent 4px),

            radial-gradient(circle at 88% 27%,
                rgba(255,255,255,.8) 0 5px,
                transparent 6px),

            radial-gradient(circle at 78% 78%,
                rgba(255,255,255,.5) 0 3px,
                transparent 4px),

            radial-gradient(circle at 93% 84%,
                rgba(255,255,255,.7) 0 4px,
                transparent 5px);

        animation: floatingBubbles 7s ease-in-out infinite alternate;
    }

    /* =========================================
       NUVENS
    ========================================= */

    h2::before,
    h2::after {
        content: "";

        position: fixed;

        width: 175px;
        height: 55px;

        border-radius: 50px;

        background: rgba(255,255,255,.72);

        box-shadow:
            45px -20px 0 8px rgba(255,255,255,.7),
            95px 3px 0 3px rgba(255,255,255,.64);

        filter: blur(.5px);

        z-index: -1;
    }

    h2::before {
        top: 13%;
        left: -35px;

        animation: cloudLeft 25s linear infinite;
    }

    h2::after {
        top: 28%;
        right: -55px;

        animation: cloudRight 30s linear infinite;
    }

    @keyframes cloudLeft {
        0% {
            transform: translateX(-20px);
        }

        50% {
            transform: translateX(200px);
        }

        100% {
            transform: translateX(-20px);
        }
    }

    @keyframes cloudRight {
        0% {
            transform: translateX(30px);
        }

        50% {
            transform: translateX(-200px);
        }

        100% {
            transform: translateX(30px);
        }
    }

    @keyframes sunPulse {
        from {
            opacity: .65;
            transform: translateX(-50%) scale(.94);
        }

        to {
            opacity: 1;
            transform: translateX(-50%) scale(1.08);
        }
    }

    @keyframes floatingBubbles {
        from {
            transform: translateY(0);
        }

        to {
            transform: translateY(-20px);
        }
    }

    /* =========================================
       TÍTULO
    ========================================= */

    h2 {
        margin: 0 0 14px;

        position: relative;

        text-align: center;

        color: #ffffff;

        font-size: clamp(28px, 6vw, 39px);
        letter-spacing: .5px;

        text-shadow:
            0 2px 0 #2387a8,
            0 4px 9px rgba(0,90,120,.35),
            0 0 18px rgba(255,255,255,.5);

        animation: titleFloat 4s ease-in-out infinite;
    }

    @keyframes titleFloat {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-5px);
        }
    }

    /* =========================================
       TEXTO INFORMATIVO
    ========================================= */

    body > p:not([style]) {
        width: 100%;
        max-width: 440px;

        margin: 0 0 18px;

        padding: 12px 17px;

        text-align: center;

        color: #24667c;

        font-size: 15px;
        line-height: 1.5;

        background:
            linear-gradient(
                to bottom,
                rgba(255,255,255,.82),
                rgba(224,249,255,.7)
            );

        border: 2px solid rgba(255,255,255,.8);
        border-radius: 17px;

        box-shadow:
            0 7px 18px rgba(0,90,120,.14),
            inset 0 2px 0 rgba(255,255,255,.9);

        backdrop-filter: blur(7px);

        animation: textAppear .7s ease-out;
    }

    @keyframes textAppear {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================================
       MENSAGENS DE ERRO
    ========================================= */

    body > p[style] {
        width: 100%;
        max-width: 440px;

        margin: 0 0 15px;
        padding: 10px 14px;

        color: #a52d2d !important;

        text-align: center;

        background:
            linear-gradient(
                to bottom,
                rgba(255,255,255,.96),
                rgba(255,225,225,.9)
            );

        border: 2px solid #ffaaaa;
        border-radius: 15px;

        box-shadow:
            0 6px 16px rgba(120,50,50,.18),
            inset 0 2px 0 rgba(255,255,255,.95);

        animation: errorAppear .45s ease-out;
    }

    @keyframes errorAppear {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================================
       PAINEL DE VALIDAÇÃO
    ========================================= */

    form {
        width: 100%;
        max-width: 440px;

        padding: 32px;

        position: relative;
        overflow: hidden;

        display: flex;
        flex-direction: column;

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,.94),
                rgba(211,248,255,.83)
            );

        border: 2px solid rgba(255,255,255,.95);
        border-radius: 28px;

        box-shadow:
            0 20px 45px rgba(0,85,120,.3),
            0 5px 12px rgba(0,100,140,.15),
            inset 0 2px 0 rgba(255,255,255,1),
            inset 0 -12px 25px rgba(70,190,220,.12);

        backdrop-filter: blur(12px);

        animation:
            formEnter .75s cubic-bezier(.2,.8,.2,1),
            formFloat 6s ease-in-out 1s infinite;

        transition: .3s ease;
    }

    /* Reflexo do vidro */
    form::before {
        content: "";

        position: absolute;

        width: 45%;
        height: 180%;

        top: -40%;
        left: -70%;

        transform: rotate(25deg);

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.6),
                transparent
            );

        pointer-events: none;

        animation: glassShine 7s ease-in-out infinite;
    }

    /* Brilho interno */
    form::after {
        content: "";

        position: absolute;
        inset: 0;

        border-radius: 28px;

        box-shadow:
            inset 0 0 25px rgba(255,255,255,.4);

        pointer-events: none;
    }

    @keyframes formEnter {
        from {
            opacity: 0;
            transform:
                translateY(35px)
                scale(.95);
            filter: blur(4px);
        }

        to {
            opacity: 1;
            transform:
                translateY(0)
                scale(1);
            filter: blur(0);
        }
    }

    @keyframes formFloat {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-4px);
        }
    }

    @keyframes glassShine {
        0%, 55% {
            left: -70%;
        }

        80%, 100% {
            left: 140%;
        }
    }

    form:hover {
        transform: translateY(-5px);

        box-shadow:
            0 25px 55px rgba(0,85,120,.34),
            0 0 25px rgba(80,220,255,.18),
            inset 0 2px 0 rgba(255,255,255,1);
    }

    /* =========================================
       LABEL
    ========================================= */

    label {
        display: block;

        margin-bottom: 8px;

        color: #17617d;

        font-size: 15px;
        font-weight: bold;

        text-shadow:
            0 1px 0 #ffffff;
    }

    /* =========================================
       CÓDIGO 2FA
    ========================================= */

    input {
        width: 100%;
        height: 58px;

        padding: 0 15px;

        outline: none;

        border: 2px solid #8ed5e7;
        border-radius: 16px;

        background:
            linear-gradient(
                to bottom,
                #ffffff,
                #effcff
            );

        color: #147a9d;

        font-family:
            "Trebuchet MS",
            Arial,
            sans-serif;

        font-size: 26px;
        font-weight: bold;

        text-align: center;
        letter-spacing: 9px;

        box-shadow:
            inset 0 3px 8px rgba(0,90,120,.08),
            0 2px 0 rgba(255,255,255,.9);

        transition:
            border-color .25s ease,
            box-shadow .25s ease,
            transform .25s ease;
    }

    input:hover {
        border-color: #55c5df;

        box-shadow:
            0 0 12px rgba(50,190,220,.16),
            inset 0 3px 8px rgba(0,90,120,.08);
    }

    input:focus {
        border-color: #20b6dc;

        transform: translateY(-2px);

        box-shadow:
            0 0 0 4px rgba(40,185,220,.14),
            0 0 20px rgba(50,200,235,.28),
            inset 0 3px 8px rgba(0,90,120,.08);
    }

    input::placeholder {
        color: #9bc5d0;
        opacity: .8;
    }

    /* =========================================
       BOTÃO
    ========================================= */

    button {
        width: 100%;
        height: 53px;

        margin-top: 16px;

        position: relative;
        overflow: hidden;

        border: 2px solid #168c39;
        border-radius: 17px;

        background:
            linear-gradient(
                to bottom,
                #a0f26e 0%,
                #58d947 45%,
                #29a938 100%
            );

        color: #ffffff;

        font-family: inherit;
        font-size: 17px;
        font-weight: bold;

        text-shadow:
            0 1px 2px rgba(0,80,0,.5);

        cursor: pointer;

        box-shadow:
            0 5px 0 #19832d,
            0 8px 17px rgba(0,100,30,.25),
            inset 0 2px 0 rgba(255,255,255,.7);

        transition: .18s ease;
    }

    /* Brilho passando pelo botão */
    button::before {
        content: "";

        position: absolute;

        width: 65%;
        height: 100%;

        top: 0;
        left: -100%;

        transform: skewX(-25deg);

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.65),
                transparent
            );

        animation: buttonShine 3.5s infinite;
    }

    @keyframes buttonShine {
        0%, 55% {
            left: -100%;
        }

        80%, 100% {
            left: 140%;
        }
    }

    button:hover {
        transform: translateY(-3px);

        filter: brightness(1.08);

        box-shadow:
            0 8px 0 #19832d,
            0 12px 24px rgba(0,100,30,.3),
            0 0 18px rgba(100,255,100,.25),
            inset 0 2px 0 rgba(255,255,255,.8);
    }

    button:active {
        transform: translateY(4px);

        box-shadow:
            0 1px 0 #19832d,
            0 3px 8px rgba(0,100,30,.2),
            inset 0 2px 0 rgba(255,255,255,.5);
    }

    /* =========================================
       RESPONSIVIDADE
    ========================================= */

    @media (max-width: 500px) {
        body {
            padding: 20px 12px;
        }

        h2 {
            font-size: 29px;
        }

        body > p:not([style]) {
            font-size: 14px;
            padding: 10px 13px;
        }

        form {
            padding: 25px 20px;
            border-radius: 23px;
        }

        form::after {
            border-radius: 23px;
        }

        input {
            height: 55px;
            font-size: 23px;
            letter-spacing: 7px;
        }

        button {
            height: 50px;
        }
    }

    /* Respeita preferência por menos movimento */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation: none !important;
            transition: none !important;
        }
    }
</style>
